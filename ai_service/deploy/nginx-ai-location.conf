# Reverse-proxy block for the Medora AI service.
# Add this inside the `server { ... }` block of medora.tigerauto.to.conf.
# The trailing slash on proxy_pass strips the /ai prefix:
#   https://medora.tigerauto.to/ai/chat  ->  http://127.0.0.1:8100/chat
location /ai/ {
    proxy_pass http://127.0.0.1:8100/;
    include /etc/nginx/proxy_params;
    client_max_body_size 10m;
    proxy_read_timeout 120s;
}
